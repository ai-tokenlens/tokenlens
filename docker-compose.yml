services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "sqlite:///./data/tokenlens.db"
      INGEST_TOKEN: "${INGEST_TOKEN:-change-me}"
      BLOB_DIR: "/app/data/skills"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}"
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}"
    depends_on:
      server:
        condition: service_healthy
