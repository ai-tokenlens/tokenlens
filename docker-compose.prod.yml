services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tokenlens}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tokenlens_secret}"
      POSTGRES_DB: "${POSTGRES_DB:-tokenlens}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokenlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-tokenlens}:${POSTGRES_PASSWORD:-tokenlens_secret}@postgres:5432/${POSTGRES_DB:-tokenlens}"
      BLOB_DIR: ""
      BLOB_S3_ENDPOINT: "${BLOB_S3_ENDPOINT}"
      BLOB_S3_BUCKET: "${BLOB_S3_BUCKET}"
      BLOB_S3_ACCESS_KEY: "${BLOB_S3_ACCESS_KEY}"
      BLOB_S3_SECRET_KEY: "${BLOB_S3_SECRET_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: []

volumes:
  postgres_data:
